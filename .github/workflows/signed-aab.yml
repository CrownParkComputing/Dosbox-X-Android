name: Build signed Android App Bundle

# Builds the Flutter app, which now lives on main. This workflow was written
# for the Java app it replaces - gradlew at the repo root, output under
# app/build - and both moved: gradlew is flutter_app/android/gradlew, and the
# bundle is produced by `flutter build appbundle` rather than a bare Gradle
# task, so the Dart and asset steps of the build actually run.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  signed-aab:
    name: Signed release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.9"
          cache: true

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/release.jks"

      - name: Build signed release bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/signing/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: flutter_app
        run: flutter build appbundle --release

      - name: Print signing fingerprint
        # The bundle has to be signed as the app it replaces: com.dosboxx.app
        # is already on Play, and a different key is a different app as far as
        # the Console is concerned. This is the cheap place to catch that.
        run: |
          keytool -printcert -jarfile \
            flutter_app/build/app/outputs/bundle/release/app-release.aab \
            | grep -E "SHA1:|SHA256:" || true

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: dosbox-multiplatform-release-aab
          path: flutter_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 2

      # The bundle goes to Play; the APK is what a person can sideload, so a
      # tag's release carries both.
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/signing/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: flutter_app
        run: flutter build apk --release

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: dosbox-multiplatform-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 2

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: signed-aab
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/dosbox-multiplatform-release-apk/*.apk
            artifacts/dosbox-multiplatform-release-aab/*.aab
