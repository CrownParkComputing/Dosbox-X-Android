name: Build signed Android App Bundle

# Produces the artefact that goes to Play Console, signed with the SAME upload
# key as the app it replaces. The application id is com.dosboxx.app, so this
# lands on the existing listing as an update; a bundle signed with anything
# else would be rejected outright, which is why the fingerprint is printed at
# the end rather than left to be discovered by the upload failing.
#
# Secrets required (unchanged from the Flutter build):
#   ANDROID_KEYSTORE_BASE64    the upload keystore, base64 encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  aab:
    name: Signed release AAB
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The core is a submodule and the bundle is worthless without it: an
          # AAB with no libretrodos.so installs, starts, and cannot run a game.
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Checked up front: without these the Gradle build does not fail, it
          # quietly falls back to the debug keystore and produces a bundle Play
          # will not take.
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/release.jks"

      - name: Build the core
        run: |
          # The NDK version is pinned in app/build.gradle.kts; install the same
          # one rather than whatever the image ships with.
          ANDROID_NDK="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          if [ ! -d "$ANDROID_NDK" ]; then
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
              --install "ndk;28.2.13676358"
          fi
          export ANDROID_NDK
          cd android && ./build-core.sh

      - name: Build signed release bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/signing/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: gradle bundleRelease

      - name: Print signing fingerprint and identity
        run: |
          # Both are worth seeing before an upload: a bundle signed with the
          # wrong key, or built under the wrong application id, is rejected by
          # Play for reasons the error message does not make obvious.
          AAB=$(find android/app/build/outputs/bundle -name '*.aab' | head -1)
          echo "bundle: $AAB"
          unzip -p "$AAB" BUNDLE-METADATA/*/*.pb >/dev/null 2>&1 || true
          keytool -printcert -jarfile "$AAB" | grep -E "SHA1|SHA256|Owner" || true

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: retro-dos-release-aab
          path: android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
