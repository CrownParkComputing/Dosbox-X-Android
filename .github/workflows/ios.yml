name: iOS

# GitHub Actions, not Xcode Cloud. The sibling app (Retro-C64) ships from an
# Actions job and it is proven end to end; Xcode Cloud needs the project wired
# up in App Store Connect by hand and gives nothing back here that this does
# not already do.
#
# ONE secret: SIGNING_PASSPHRASE. The certificate, the provisioning profile,
# the App Store Connect key and the passwords all live in ios/signing/*.enc,
# encrypted with it. See ios/signing/README.md.
#
# Gated on that secret being set, so a fork without it still builds -- and a
# broken tree therefore still fails loudly rather than waiting to be noticed.

on:
  push:
    branches: [main]
    tags: ['ios-v*']
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-26
    env:
      HAS_IOS_SIGNING: ${{ secrets.SIGNING_PASSPHRASE != '' }}
      BUNDLE_ID: com.crownparkcomputing.dosboxretro
      TEAM_ID: 88A3T9K9C5
      PROFILE_NAME: Retro-Dosbox AppStore

    steps:
      # The core is a submodule and nothing builds without it. ios/build-core.sh
      # stops early and says so rather than failing later inside the compiler,
      # but a checkout without this wastes the whole job.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # macOS ships BSD m4, which autoconf refuses ("no acceptable m4 could be
      # found in $PATH"). cmake and the autotools come from brew; the runner
      # has write access to it, unlike a locked-down workstation.
      - name: Build tools
        run: brew install autoconf automake libtool cmake

      - name: Build the core and frontend
        run: ./ios/build-core.sh

      - name: Decrypt the signing material
        if: env.HAS_IOS_SIGNING == 'true'
        env:
          PASS: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/signing"; mkdir -p "$D"; chmod 700 "$D"
          dec() { openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
                    -in "ios/signing/$1" -out "$D/$2" -pass env:PASS; }
          dec dist.p12.enc                dist.p12
          dec profile.mobileprovision.enc profile.mobileprovision
          dec asc_key.p8.enc              asc_key.p8
          dec signing.env.enc             signing.env
          echo "D=$D" >> "$GITHUB_ENV"

      - name: Import signing certificate
        if: env.HAS_IOS_SIGNING == 'true'
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . "$D/signing.env"
          KEYCHAIN=build.keychain
          security create-keychain -p actions "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"      # no auto-lock mid-build
          security unlock-keychain -p actions "$KEYCHAIN"
          security import "$D/dist.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          # codesign: in the partition list is the whole point. Without it the
          # key imports, `security find-identity` reports it valid, and every
          # signing attempt fails with errSecInternalComponent -- which reads
          # like a broken certificate and is nothing of the kind.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$D/profile.mobileprovision" \
            ~/Library/MobileDevice/Provisioning\ Profiles/build.mobileprovision

      # App Store Connect refuses a CFBundleVersion it has already seen, and
      # says so only AFTER the whole upload has transferred. A UTC timestamp is
      # monotonic without having to ask the server what it already holds.
      - name: Choose a build number
        id: buildno
        run: echo "n=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      - name: Configure the app
        run: |
          set -euo pipefail
          if [ "$HAS_IOS_SIGNING" = "true" ]; then
            SIGN_ARGS=(-DRETRODOS_CODE_SIGN_STYLE=Manual
                       -DRETRODOS_PROVISIONING_PROFILE="$PROFILE_NAME"
                       -DRETRODOS_CODE_SIGN_IDENTITY="Apple Distribution")
          else
            SIGN_ARGS=()
          fi
          cmake -S ios -B ios/build/app -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DRETRODOS_BUILD="${{ steps.buildno.outputs.n }}" \
            -DRETRODOS_BUNDLE_ID="$BUNDLE_ID" \
            -DRETRODOS_TEAM_ID="$TEAM_ID" \
            "${SIGN_ARGS[@]+"${SIGN_ARGS[@]}"}"

      # xcodebuild archive, and signing lives on the target (set in
      # CMakeLists.txt) rather than on this command line, because a
      # command-line PROVISIONING_PROFILE_SPECIFIER applies to EVERY target.
      - name: Archive
        if: env.HAS_IOS_SIGNING == 'true'
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project ios/build/app/RetroDos.xcodeproj -scheme RetroDos \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/RetroDos.xcarchive

      # Unsigned builds still have to compile and produce a bundle, or a broken
      # tree goes unnoticed until someone adds the secrets.
      - name: Build (unsigned, no secrets configured)
        if: env.HAS_IOS_SIGNING != 'true'
        run: |
          xcodebuild -project ios/build/app/RetroDos.xcodeproj -scheme RetroDos \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      # An upload can report "UPLOAD SUCCEEDED", be given a delivery UUID, and
      # then be discarded in processing -- by email, with CI green and no build
      # ever appearing. A missing icon key and a missing purpose string both do
      # exactly that, so they are checked in the BUILT bundle, not the source.
      - name: Verify the bundle cannot be discarded in processing
        if: env.HAS_IOS_SIGNING == 'true'
        run: |
          set -euo pipefail
          plist=build/RetroDos.xcarchive/Products/Applications/RetroDos.app/Info.plist
          need() {
            /usr/bin/plutil -extract "$1" raw -o - "$plist" >/dev/null 2>&1 \
              || { echo "::error::$1 is missing from the built bundle"; exit 1; }
          }
          need CFBundleIcons.CFBundlePrimaryIcon.CFBundleIconName
          need ITSAppUsesNonExemptEncryption

          # Purpose strings, derived from what the BINARY links rather than from
          # a list somebody remembered to update. A bundle that links a
          # protected API needs the string whether or not it calls it, and
          # Apple reports the lack only after a delivery that reported success
          # -- ITMS-90683, by email, hours later, with the job green. That is
          # how the first 2.0 upload was lost.
          bin=build/RetroDos.xcarchive/Products/Applications/RetroDos.app/RetroDos
          check_api() {   # <objc class> <Info.plist key>
            if nm -u "$bin" 2>/dev/null | grep -q "$1"; then
              need "$2"
              echo "  $1 is linked -> $2 present"
            fi
          }
          check_api CBCentralManager NSBluetoothAlwaysUsageDescription
          check_api AVCaptureDevice  NSCameraUsageDescription
          check_api AVAudioSession   NSMicrophoneUsageDescription
          check_api CLLocationManager NSLocationWhenInUseUsageDescription
          check_api PHPhotoLibrary   NSPhotoLibraryUsageDescription
          check_api CNContactStore   NSContactsUsageDescription
          echo "bundle looks deliverable"

      - name: Export the IPA
        if: env.HAS_IOS_SIGNING == 'true'
        run: |
          set -euo pipefail
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/RetroDos.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath build/ipa

      - name: Upload to App Store Connect
        if: env.HAS_IOS_SIGNING == 'true'
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . "$D/signing.env"
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$D/asc_key.p8" ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcrun altool --upload-app -f build/ipa/*.ipa -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
