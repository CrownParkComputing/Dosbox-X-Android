name: iOS

# Builds the iOS app and, when the secrets are present, signs it and uploads it
# to App Store Connect.
#
# WHY IT DOES NOT BUILD THE CORE. libdosboxcore is DOSBox-X cross-configured
# with autotools against an SDL2 and libpng built for iOS -- minutes of work
# from a source tree that lives outside this repository. It is committed as an
# xcframework for exactly that reason, the same as Retro-C64, Retro-Amiga and
# Retro-Saturn do with theirs. Rebuild it locally with
# native/dosbox_core/ios/build-ios-macos.sh (add IOS_PLATFORM=iphonesimulator
# for the simulator slice) and commit the result.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Pinned, and the same version ios/ci_scripts/ci_post_clone.sh installs. An
  # untracked toolchain resolves different transitive packages and rewrites
  # pubspec.lock mid-build, so CI and the cloud build would differ for reasons
  # that have nothing to do with the commit being built.
  FLUTTER_VERSION: "3.47.1"

jobs:
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Apple rejects any upload built against an iOS SDK older than 26, and
      # says so only AFTER the whole IPA has transferred -- a full build plus a
      # 30-second upload spent to learn the toolchain was wrong:
      #   "This app was built with the iOS 17.5 SDK. All iOS and iPadOS apps
      #    must be built with the iOS 26 SDK or later" (409)
      # So the check runs first and fails in seconds. It picks the newest Xcode
      # the image actually carries rather than trusting the label's default,
      # which is what silently supplied the 17.5 SDK in the first place.
      - name: Select an Xcode with the iOS 26 SDK or newer
        run: |
          set -euo pipefail
          sdk_major() {
            DEVELOPER_DIR="$1/Contents/Developer" xcodebuild -showsdks 2>/dev/null \
              | sed -n 's/.*-sdk iphoneos\([0-9][0-9]*\).*/\1/p' | sort -n | tail -1
          }

          # The image default comes first, deliberately. The runner carries a
          # dozen side-by-side Xcodes and they are NOT equivalent: only the
          # default has its iOS platform components downloaded. Picking another
          # one gets an Xcode that lists the iOS 26 SDK and still cannot build
          # for a device -- "iOS 26.0 is not installed. Please download and
          # install the platform from Xcode > Settings > Components" -- which
          # surfaces at build time, not here.
          pick=""
          if [ -d /Applications/Xcode.app ]; then
            v=$(sdk_major /Applications/Xcode.app || true)
            if [ -n "$v" ] && [ "$v" -ge 26 ]; then pick=/Applications/Xcode.app; fi
          fi

          # Only if the default is too old. Compared on the full version, not
          # the major: every Xcode here reports iOS SDK 26, so a major-only
          # comparison never advances and silently keeps whichever sorted first.
          if [ -z "$pick" ]; then
            best=""
            for app in $(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V); do
              v=$(sdk_major "$app" || true)
              [ -n "$v" ] && [ "$v" -ge 26 ] || continue
              best="$app"
            done
            pick="$best"
          fi

          if [ -z "$pick" ]; then
            echo "::error::No Xcode on this runner has the iOS 26 SDK."
            echo "::error::App Store Connect refuses anything older. Bump runs-on."
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi

          sudo xcode-select -s "$pick/Contents/Developer"
          echo "selected $pick"
          xcodebuild -version
          # Listed is not the same as installed, so prove the platform is real.
          sdks="$(xcode-select -p)/Platforms/iPhoneOS.platform/Developer/SDKs"
          ls "$sdks" || { echo "::error::no iPhoneOS SDKs under $sdks"; exit 1; }
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # gamepads_ios has no Swift Package Manager support, and Flutter 3.47
      # enables SPM by default. The mixed SPM/CocoaPods registrant then fails
      # to compile for device:
      #   Parse Issue (Xcode): Module 'gamepads_ios' not found
      #   ios/Runner/GeneratedPluginRegistrant.m:17:8
      # which Flutter reports as the far less specific "No Xcode build settings
      # have been found". CocoaPods handles every plugin here, including that
      # one, so SPM is off until the plugin adopts it.
      - name: Use CocoaPods rather than Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      # An app that builds but ships no core installs fine and then reports
      # "Stub core: libdosboxcore not found" at runtime, which reads as a
      # signing or packaging fault and is neither. Both slices are checked:
      # a device binary in the simulator slot builds green and dies at dlopen
      # on a simulator, and only there.
      - name: Verify the committed core carries both slices
        run: |
          xc=flutter_app/ios/Frameworks/libdosboxcore.xcframework
          for slice in ios-arm64 ios-arm64-simulator; do
            bin="$xc/$slice/libdosboxcore.framework/libdosboxcore"
            if [ ! -f "$bin" ]; then
              echo "::error::$bin is missing -- rebuild with"
              echo "::error::native/dosbox_core/ios/build-ios-macos.sh and commit it."
              exit 1
            fi
          done
          vtool -show-build "$xc/ios-arm64/libdosboxcore.framework/libdosboxcore" \
            | grep -q "platform IOS$" \
            || { echo "::error::ios-arm64 slice is not a device binary"; exit 1; }
          vtool -show-build "$xc/ios-arm64-simulator/libdosboxcore.framework/libdosboxcore" \
            | grep -q "platform IOSSIMULATOR" \
            || { echo "::error::simulator slice is not a simulator binary"; exit 1; }

      - name: Analyze and test
        working-directory: flutter_app
        run: |
          flutter pub get
          flutter analyze lib/
          flutter test

      - name: Build (unsigned)
        working-directory: flutter_app
        run: flutter build ios --release --no-codesign

      # Prove the embed phase actually ran, at the exact path
      # RetroDosboxNativePaths._iosFrameworkLibrary opens at runtime. This is
      # the check that would have caught the core never being embedded at all.
      - name: Verify the core is embedded in the app
        run: |
          app=flutter_app/build/ios/iphoneos/Runner.app
          bin="$app/Frameworks/libdosboxcore.framework/libdosboxcore"
          if [ ! -f "$bin" ]; then
            echo "::error::libdosboxcore.framework is missing from $app/Frameworks --"
            echo "::error::the Runner target's Embed Frameworks phase did not copy it."
            exit 1
          fi
          file "$bin"

      # The demo and FreeDOS are what make the app usable with nothing supplied,
      # so their absence from the bundle is a shipping fault, not a detail.
      - name: Verify the bundled demo and FreeDOS shipped
        run: |
          assets=flutter_app/build/ios/iphoneos/Runner.app/Frameworks/App.framework/flutter_assets/assets
          for f in demo/DEMO.COM freedos/FD13BOOT.img; do
            [ -f "$assets/$f" ] || { echo "::error::$f missing from the bundle"; exit 1; }
          done
          ls -l "$assets/demo" "$assets/freedos"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: flutter_app/build/ios/iphoneos/Runner.app

      # --- Signed build and upload. Skipped without secrets, so forks and
      # --- pull requests still build the unsigned app rather than failing on
      # --- a credential they cannot have.
      - name: Do we have signing and API credentials?
        id: creds
        run: |
          if [ -n "${{ secrets.APPSTORE_CERT_BASE64 }}" ] \
             && [ -n "${{ secrets.ASC_KEY_P8_BASE64 }}" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "note: no signing/API secrets -- skipping the App Store upload"
          fi

      - name: Import signing certificate
        if: steps.creds.outputs.have == 'true'
        env:
          CERT_BASE64: ${{ secrets.APPSTORE_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPSTORE_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPSTORE_PROFILE_BASE64 }}
        run: |
          KEYCHAIN=build.keychain
          security create-keychain -p actions "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"     # no auto-lock mid-build
          security unlock-keychain -p actions "$KEYCHAIN"
          echo "$CERT_BASE64" | base64 -d > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          # codesign: belongs in this list. Without it the key imports,
          # `security find-identity` reports it valid, and every signing attempt
          # fails with errSecInternalComponent -- which reads as a broken
          # certificate and is not one.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k actions "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 -d \
            > ~/Library/MobileDevice/Provisioning\ Profiles/build.mobileprovision
          rm cert.p12

      # App Store Connect refuses a CFBundleVersion it has already seen, and
      # says so only AFTER the whole upload has transferred. A UTC timestamp is
      # monotonic without having to ask the server what it already holds.
      - name: Choose a build number
        if: steps.creds.outputs.have == 'true'
        id: buildno
        run: echo "n=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      # xcodebuild archive + export, NOT `flutter build ipa`.
      #
      # The Runner target is set to Automatic signing, and `flutter build ipa`
      # honours that: it looks for a DEVELOPMENT certificate and a Development
      # Team, finds neither on a runner with no Apple ID, and stops with "No
      # development certificates available to code sign app for device
      # deployment" -- while the distribution certificate and profile it
      # actually needs are sitting right there, imported and installed.
      #
      # Manual signing is passed on the command line so the committed project
      # keeps Automatic, which is what a developer opening it in Xcode wants.
      - name: Build signed IPA
        if: steps.creds.outputs.have == 'true'
        working-directory: flutter_app
        env:
          TEAM_ID: 88A3T9K9C5
          BUNDLE_ID: com.crownparkcomputing.dosboxretro
          PROFILE_NAME: Retro-Dosbox AppStore
          IDENTITY: Apple Distribution
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign \
            --build-number=${{ steps.buildno.outputs.n }}

          # Archive UNSIGNED, then let -exportArchive do the signing.
          #
          # Signing settings on the xcodebuild command line apply to every
          # target in the workspace, including the CocoaPods ones, and pods
          # reject them outright: "package_info_plus does not support
          # provisioning profiles", once per pod. Export signs the app alone,
          # which is the only thing that needs it.
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/archive/Runner.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="$TEAM_ID"

          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>$IDENTITY</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ios/ipa

          ls -l build/ios/ipa

      - name: Upload to App Store Connect
        if: steps.creds.outputs.have == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          # altool finds the key by this exact filename, derived from the key
          # id -- it is not configurable.
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 -d \
            > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          ipa=$(ls flutter_app/build/ios/ipa/*.ipa | head -1)
          echo "uploading $ipa"
          # No --validate-app first: the structural checks run server-side AFTER
          # the transfer, so a clean validation proves nothing and only costs a
          # second upload of the same bytes.
          xcrun altool --upload-app -f "$ipa" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          rm -f ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - uses: actions/upload-artifact@v4
        if: steps.creds.outputs.have == 'true'
        with:
          name: ios-ipa
          path: flutter_app/build/ios/ipa/*.ipa
